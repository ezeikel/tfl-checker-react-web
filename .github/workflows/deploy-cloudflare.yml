# Deploys the Worker on every push to main once the cutover script has set
# vars.CLOUDFLARE_CUTOVER=true (so merging the branch early deploys nothing).
name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
env:
  HUSKY: '0'
jobs:
  web:
    if: vars.CLOUDFLARE_CUTOVER == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        env:
          # Font Awesome Pro registry (bunfig.toml).
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Build
        env:
          # Public values: vite inlines them into the browser bundle.
          VITE_TFL_API_URL: ${{ vars.VITE_TFL_API_URL }}
          VITE_TFL_APP_ID: ${{ vars.VITE_TFL_APP_ID }}
          VITE_TFL_APP_KEY: ${{ vars.VITE_TFL_APP_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: bun run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.151.3 deploy
