# Deploys the Worker on every push to main once the cutover script has set
# vars.CLOUDFLARE_CUTOVER=true (so merging the branch early deploys nothing).
name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
env:
  HUSKY: '0'
jobs:
  web:
    if: vars.CLOUDFLARE_CUTOVER == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
      - name: Install
        env:
          # Font Awesome Pro registry (bunfig.toml).
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: bun --no-env-file install --frozen-lockfile
      - name: Validate and build exact production artifact
        env:
          # Public values: vite inlines them into the browser bundle.
          VITE_TFL_API_URL: ${{ vars.VITE_TFL_API_URL }}
          VITE_TFL_APP_ID: ${{ vars.VITE_TFL_APP_ID }}
          VITE_TFL_APP_KEY: ${{ vars.VITE_TFL_APP_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          TFL_BUILD_MODE: production
        run: |
          bun --no-env-file run check-types
          bun --no-env-file run test
          bun --no-env-file run build
          bun --no-env-file run artifact:record production
          bun --no-env-file x playwright install --with-deps chromium
          bun --no-env-file run test:browser
          bun --no-env-file run artifact:verify "$GITHUB_SHA"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bun --no-env-file x wrangler@4.151.3 deploy --env production --message "Reviewed React TFL source $GITHUB_SHA"
